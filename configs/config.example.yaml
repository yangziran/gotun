# ==========================================
# Gotun v1.1.0 企业级核心配置文件示例
# 极速边缘网关、原生桌面状态栏、智能分流、双栈 IPv6 与极速 DNS 缓存
# ==========================================

# ------------------------------------------
# [可选] 智能路由分流引擎 (Smart Routing)
# 专为跨境与复杂内网设计，避免流量浪费与死循环。
# ------------------------------------------
routing:
  mode: "pac"          # 模式: "global" (全部代理) 或 "pac" (绕过国内局域网与大陆 IP)
  bypass_lan: true     # 是否强制绕过局域网直连 (极度建议开启，防止局域网死循环)

# ------------------------------------------
# [可选] Prometheus 监控探针
# 开启后，可通过浏览器访问该端口查看底层网络 I/O 与并发状态。
# ------------------------------------------
metrics_addr: "127.0.0.1:9090"

# ------------------------------------------
# [可选] 极速内置 DNS 缓存与防污染代理 (类似 mosdns)
# 基于 miekg/dns 引擎，使用策略模式解耦网络。配合 PAC 路由引擎，实现分流与极致的防污染解析加速。
# 支持全链路双栈 IPv6 监听，自动为 IPv4 和 IPv6 隔离缓存域 (A / AAAA 记录互不影响)。
# ------------------------------------------
dns:
  enable: false                  # 明确开关，必须设为 true 才会启动 DNS 服务
  # 本地 DNS 监听地址 (支持填写双栈地址或 0.0.0.0。填入 127.0.0.1 会自动为您双栈监听 [::1])
  listen_addr: "127.0.0.1:53"    
  # upstream 支持强大的多协议策略路由，按需更换前缀:
  # - 标准 UDP: "udp://119.29.29.29:53" (默认 IPv4)
  # - 标准 UDP: "udp://[2402:4e00::]:53" (IPv6)
  # - 防污染 DoT: "tls://dot.pub:853"
  # - 防污染 DoH: "https://doh.pub/dns-query"
  # - 国密 TLCP DoH: "gmdoh://sm2.doh.pub/dns-query" (底层劫持重写国密双证书 TLS 握手)
  upstream: "udp://119.29.29.29:53"

# ------------------------------------------
# 1. 服务器配置 (servers)
# 定义所有 SSH 服务器资源池，原生支持纯 IPv6 (IPv6-Only) 节点、堡垒机链路穿透与多路并发。
# ------------------------------------------
servers:
  - name: "tokyo_node"           # 节点别名
    host: "8.211.x.x"            # SSH 服务器的 IPv4 / IPv6 或域名 (例如纯 v6 节点: 2001:db8::1)
    port: 22                     # SSH 端口号
    user: "root"                 # SSH 登录用户名
    password: "your_password"    # 密码认证 (也可以用 key_path: "~/.ssh/id_rsa")
    encrypted: false             # 若为密文密码请设为 true，结合 gotun encrypt 命令
    pool_size: 8                 # 【极速特性】开启 8 条并发连接，打破高延迟弱网单通道队头阻塞，推荐跨境流媒体拉满 8-16
    
  - name: "jump_server"
    host: "100.20.0.1"
    port: 22
    user: "admin"
    key_path: "~/.ssh/id_rsa"
    
  - name: "target_server"
    host: "192.168.1.100"
    port: 22
    user: "root"
    key_path: "~/.ssh/id_rsa"
    jump_host: "jump_server"     # 【企业穿透】自动通过上面的 jump_server 堡垒机作为跳板连接此靶机

# ------------------------------------------
# 2. 隧道配置 (tunnels)
# 支持同时声明多条异构隧道，底层会自动复用物理连接，全系隧道均已重构支持双栈 IPv6 与并发解析。
# ------------------------------------------
tunnels:
  # 【示例 A：动态代理转发 (SOCKS5 跨境流媒体 / 智能路由网关)】
  - name: "tokyo_proxy"
    server_names: ["tokyo_node"]
    type: "dynamic"              # SOCKS5 代理模式 (已加载顶部的 pac 路由引擎)
    # 本地监听端口，填写 127.0.0.1 将会自动同时监听 IPv4 与 IPv6(::1)
    local_addr: "127.0.0.1:1080" 

  # 【示例 B：本地端口转发 (访问企业内网深处数据库)】
  - name: "db_tunnel"
    server_names: ["target_server"] # 绑定跨跳板机的内网靶机
    type: "local"                
    local_addr: "127.0.0.1:33060" # 本地连这个端口
    remote_addr: "10.0.0.5:3306"  # 流量直达内网数据库 (支持填写远端内网 IPv6 地址)

  # 【示例 C：远程反向穿透 (公网暴露本地服务 / 完美替代 frp)】
  - name: "intranet_web"
    server_names: ["tokyo_node", "jump_server"] # 【高可用 (HA)】主备容灾切换，主节点挂了自动漂移到备节点
    type: "remote"               
    local_addr: "127.0.0.1:8000" # 本地正运行的服务
    # 让公网机器的 8000 端口映射到本地 (注: 需远端开启 GatewayPorts yes，若填写 [::]:8000 可在远端开启双栈监听)
    remote_addr: "0.0.0.0:8000"  
